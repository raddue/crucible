api_surface:
  - name: "Noticed But Not Touching (report format)"
    type: "interface"
    signature: "### Noticed But Not Touching\n\n- **file:** `path:L<start>-L<end>`\n  **noticed:** <desc>\n  **why it matters:** <risk/opportunity>\n  **suggested follow-up:** <optional>"
    params:
      - name: "file_path_with_line_range"
        type: "string"
        required: true
      - name: "noticed"
        type: "prose"
        required: true
      - name: "why_it_matters"
        type: "prose"
        required: true
      - name: "suggested_follow_up"
        type: "prose"
        required: false
    description: "Structured entry for out-of-scope observations surfaced during implementation. Appears as a required section in every build implementer report. If no observations, implementer writes `*(none)*`."

  - name: "docs/plans/<pipeline-id>-noticed.md"
    type: "interface"
    signature: "Markdown file containing aggregated Noticed entries from all implementers in a /build pipeline"
    params: []
    description: "Per-pipeline artifact written by the build orchestrator after implementer reconciliation. Committed with the PR. Skipped if zero entries across all implementers."

